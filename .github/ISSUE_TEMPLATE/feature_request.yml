name: Feature request
description: Something the SDK should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The API or behaviour you have in mind, if any.
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options: [brudcast_flutter, brudcast_in_app, brudcast_push]
