name: Bug report
description: Something in the SDK does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go to security@brudcast.com or a private advisory, never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code or project that shows the problem.
      render: dart
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package versions
      placeholder: brudcast_flutter 0.2.0, brudcast_in_app 0.2.0, brudcast_push 0.2.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Android, iOS]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The output of `flutter --version`, and the device or emulator with its OS version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `logLevel: BrudcastLogLevel.debug` and paste the `Brudcast` lines from Logcat or the Xcode console, with user data removed.
      render: text
