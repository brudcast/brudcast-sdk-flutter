name: brudcast_example
description: The Brudcast Flutter example, built the way a customer app would use the SDK.
publish_to: none
version: 0.2.1+1

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  brudcast_flutter: 0.2.1
  brudcast_in_app: 0.2.1
  brudcast_push: 0.2.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
