name: brudcast_push
description: Push notifications for the Brudcast Flutter SDK. Works alongside firebase_messaging and records opens with no Dart code.
version: 0.2.2
homepage: https://brudcast.com
repository: https://github.com/brudcast/brudcast-sdk-flutter/tree/main/packages/brudcast_push
issue_tracker: https://github.com/brudcast/brudcast-sdk-flutter/issues
documentation: https://docs.brudcast.com
topics:
  - push-notifications
  - notifications
  - engagement

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  brudcast_flutter: ^0.2.2
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.10

flutter:
  plugin:
    platforms:
      android:
        package: com.brudcast.flutter.push
        pluginClass: BrudcastPushPlugin
      ios:
        pluginClass: BrudcastPushPlugin
