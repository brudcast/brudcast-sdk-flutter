name: brudcast_flutter
description: The Brudcast SDK for Flutter. Sessions, identity, events and deep link handling over the native Android and iOS SDKs.
version: 0.2.0
homepage: https://brudcast.com
repository: https://github.com/brudcast/brudcast-sdk-flutter/tree/main/packages/brudcast_flutter
issue_tracker: https://github.com/brudcast/brudcast-sdk-flutter/issues
documentation: https://docs.brudcast.com
topics:
  - analytics
  - in-app-messaging
  - push-notifications
  - engagement

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.10

flutter:
  plugin:
    platforms:
      android:
        package: com.brudcast.flutter
        pluginClass: BrudcastFlutterPlugin
      ios:
        pluginClass: BrudcastFlutterPlugin
